name: Release Artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for hotfix exception path)"
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package archive
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE="agentspec-v${VERSION}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/agentspec" "dist/agentspec"
          tar -C dist -czf "dist/${ARCHIVE}" agentspec
          rm "dist/agentspec"

      - name: Smoke test packaged archive
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE="agentspec-v${VERSION}-${{ matrix.target }}.tar.gz"
          mkdir -p smoke
          tar -C smoke -xzf "dist/${ARCHIVE}"
          OUTPUT=$("smoke/agentspec" --version)
          case "${OUTPUT}" in
            *"${VERSION}"*) ;;
            *)
              echo "Expected version ${VERSION} in output, got: ${OUTPUT}" >&2
              exit 1
              ;;
          esac

      - name: Upload archive artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-archive-${{ matrix.target }}
          path: dist/*.tar.gz

  homebrew-gate:
    name: Homebrew gate
    needs: build
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-archive-*
          merge-multiple: true
          path: dist

      - name: Verify install using temporary tap
        run: |
          VERSION="${RELEASE_TAG#v}"
          TARGET="aarch64-apple-darwin"
          ARCHIVE="agentspec-v${VERSION}-${TARGET}.tar.gz"
          read -r SHA _ < <(shasum -a 256 "dist/${ARCHIVE}")

          brew tap-new --no-git agentspec-ci/tap
          TAP_FORMULA="$(brew --repository agentspec-ci/tap)/Formula/agentspec.rb"

          cat > "${TAP_FORMULA}" <<EOF
          class Agentspec < Formula
            desc "agentspec release verification formula"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${VERSION}"
            url "file://${GITHUB_WORKSPACE}/dist/${ARCHIVE}"
            sha256 "${SHA}"

            def install
              bin.install "agentspec"
            end
          end
          EOF

          brew install agentspec-ci/tap/agentspec
          OUTPUT=$(agentspec --version)
          case "${OUTPUT}" in
            *"${VERSION}"*) ;;
            *)
              echo "Expected version ${VERSION} in output, got: ${OUTPUT}" >&2
              exit 1
              ;;
          esac

  publish:
    name: Publish release assets
    needs:
      - build
      - homebrew-gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag, Cargo version, and release metadata
        id: meta
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agentspec") | .version')

          if [ "${TAG}" = "${VERSION}" ]; then
            echo "Expected tag with v-prefix, got: ${TAG}" >&2
            exit 1
          fi

          if [ "${VERSION}" != "${CARGO_VERSION}" ]; then
            echo "Tag version (${VERSION}) does not match Cargo.toml (${CARGO_VERSION})." >&2
            exit 1
          fi

          RELEASE_TAG_FROM_API=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.tag_name')
          if [ "${RELEASE_TAG_FROM_API}" != "${TAG}" ]; then
            echo "Release metadata tag (${RELEASE_TAG_FROM_API}) does not match workflow tag (${TAG})." >&2
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            git fetch origin main --quiet
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Tag ${TAG} is not on origin/main. Use workflow_dispatch for hotfix exceptions." >&2
              exit 1
            fi
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "SBOM_FILE=agentspec-v${VERSION}-sbom.spdx.json" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Download archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-archive-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum agentspec-v${VERSION}-*.tar.gz > ../SHA256SUMS

      - name: Verify SHA256SUMS integrity
        run: |
          cd dist
          sha256sum --check ../SHA256SUMS

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: ${{ env.SBOM_FILE }}
          upload-artifact: false
          upload-release-assets: false

      - name: Upload release assets
        run: gh release upload "${RELEASE_TAG}" dist/*.tar.gz SHA256SUMS "${SBOM_FILE}" --clobber

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-metadata
          path: SHA256SUMS

      - name: Attest release archives
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: dist/*.tar.gz

      - name: Attest SPDX SBOM
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: ${{ env.SBOM_FILE }}

  tap-pr:
    name: Open Homebrew tap PR
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
      VERSION: ${{ needs.publish.outputs.version }}
      HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
    steps:
      - name: Validate token configuration
        run: |
          if [ -z "${HOMEBREW_TAP_PAT}" ]; then
            echo "Missing HOMEBREW_TAP_PAT secret. Configure a token with write access to jasnross/homebrew-tap." >&2
            exit 1
          fi

      - name: Check out tap repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: jasnross/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          path: homebrew-tap

      - name: Download release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-metadata
          path: release-metadata

      - name: Update formula and open or update PR
        id: tap_pr
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          set -euo pipefail

          SHA_FILE="${GITHUB_WORKSPACE}/release-metadata/SHA256SUMS"
          FORMULA="Formula/agentspec.rb"

          if [ ! -f "${SHA_FILE}" ]; then
            echo "Missing SHA256SUMS artifact from release workflow." >&2
            exit 1
          fi

          ARM_SHA=$(grep "agentspec-v${VERSION}-aarch64-apple-darwin.tar.gz" "${SHA_FILE}" | awk '{print $1}')
          MAC_SHA=$(grep "agentspec-v${VERSION}-x86_64-apple-darwin.tar.gz" "${SHA_FILE}" | awk '{print $1}')
          LINUX_SHA=$(grep "agentspec-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" "${SHA_FILE}" | awk '{print $1}')

          if [ -z "${ARM_SHA}" ] || [ -z "${MAC_SHA}" ] || [ -z "${LINUX_SHA}" ]; then
            echo "Failed to parse one or more target digests from SHA256SUMS for ${RELEASE_TAG}." >&2
            exit 1
          fi

          cd homebrew-tap

          git config user.name "agentspec-bot"
          git config user.email "actions@users.noreply.github.com"

          BRANCH="automation/agentspec-${RELEASE_TAG}"
          if git ls-remote --exit-code origin "${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH}"
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
          else
            git checkout -b "${BRANCH}"
          fi

          TMP_FILE=$(mktemp)
          awk -v version="${VERSION}" -v arm_sha="${ARM_SHA}" -v mac_sha="${MAC_SHA}" -v linux_sha="${LINUX_SHA}" '
            /^  version "/ {
              print "  version \"" version "\""
              next
            }
            /aarch64-apple-darwin\.tar\.gz/ {
              print
              getline
              print "      sha256 \"" arm_sha "\""
              next
            }
            /x86_64-apple-darwin\.tar\.gz/ {
              print
              getline
              print "      sha256 \"" mac_sha "\""
              next
            }
            /x86_64-unknown-linux-gnu\.tar\.gz/ {
              print
              getline
              print "      sha256 \"" linux_sha "\""
              next
            }
            { print }
          ' "${FORMULA}" > "${TMP_FILE}"
          mv "${TMP_FILE}" "${FORMULA}"

          FORMULA_CHANGED="false"
          git add "${FORMULA}"
          if git diff --cached --quiet; then
            echo "No formula changes detected for ${RELEASE_TAG}."
          else
            FORMULA_CHANGED="true"
            git commit -m "chore(agentspec): update formula to ${RELEASE_TAG}"
            git push --set-upstream origin "${BRANCH}"
          fi

          EXISTING_PR_NUMBER=$(gh pr list --repo jasnross/homebrew-tap --head "${BRANCH}" --state open --json number --jq '.[0].number')
          PR_TITLE="chore(agentspec): update formula to ${RELEASE_TAG}"
          PR_BODY=$(cat <<EOF
          ## Summary
          - update `Formula/agentspec.rb` to ${RELEASE_TAG}
          - refresh macOS arm64/x64 and Linux x64 SHA256 values from release SHA256SUMS

          ## Source Release
          - https://github.com/jasnross/agentspec/releases/tag/${RELEASE_TAG}
          EOF
          )

          if [ -n "${EXISTING_PR_NUMBER}" ]; then
            gh pr edit "${EXISTING_PR_NUMBER}" --repo jasnross/homebrew-tap --title "${PR_TITLE}" --body "${PR_BODY}"
            PR_URL=$(gh pr view "${EXISTING_PR_NUMBER}" --repo jasnross/homebrew-tap --json url --jq '.url')
          elif [ "${FORMULA_CHANGED}" = "false" ]; then
            PR_URL=""
          else
            PR_URL=$(gh pr create --repo jasnross/homebrew-tap --base main --head "${BRANCH}" --title "${PR_TITLE}" --body "${PR_BODY}")
          fi

          echo "pr_url=${PR_URL}" >> "${GITHUB_OUTPUT}"

      - name: Summarize tap automation result
        run: |
          {
            echo "## Homebrew tap automation"
            echo
            if [ -n "${{ steps.tap_pr.outputs.pr_url }}" ]; then
              echo "Tap PR: ${{ steps.tap_pr.outputs.pr_url }}"
            else
              echo "No tap PR created: formula already matched ${RELEASE_TAG}."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
