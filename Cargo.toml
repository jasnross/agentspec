[package]
name = "agentspec"
version = "0.1.0"
edition = "2024"
description = "Compile provider-neutral SKILL.md/AGENT.md specs into ready-to-use AI coding agent configurations"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
indexmap = { version = "2", features = ["serde"] }
jsonschema = "0.28"
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
thiserror = "2"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
assigning_clones = "deny"
complexity = "deny"
doc_markdown = "deny"
expect_used = "deny"
items_after_statements = "deny"
manual_let_else = "deny"
map_unwrap_or = "deny"
match_wildcard_for_single_variants = "deny"
needless_pass_by_value = "deny"
option_option = "deny"
panic = "deny"
perf = "deny"
style = "deny"
suspicious = "deny"
too_many_lines = "deny"
uninlined_format_args = "deny"
unnecessary_wraps = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
