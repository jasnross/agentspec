[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
  # Additional licenses we're ok with if needed:
  # "ISC",
  # "MPL-2.0",
  # "Unicode-DFS-2016",
]
exceptions = []
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
